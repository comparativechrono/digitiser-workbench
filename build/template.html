<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Digitiser workbench</title>
<meta name="description" content="Read the values out of graphs in papers – lines, points, bars, actograms, heat maps and polar plots – with trace-digitiser, by pointing and clicking, in a Python notebook or in a terminal. Everything runs in your browser: no picture is uploaded anywhere.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect x='4' y='4' width='120' height='120' rx='26' fill='%2317324A'/%3E%3Cpath d='M30 24v74h76' fill='none' stroke='%23F3F7FA' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M38 82l20-24 16 10 24-34' fill='none' stroke='%23F59E0B' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='58' cy='58' r='7' fill='%23F3F7FA'/%3E%3Ccircle cx='98' cy='34' r='7' fill='%23F3F7FA'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/vendor/codemirror/codemirror.css">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/genomics.css">
<link rel="stylesheet" href="assets/css/nb-ai.css">
<link rel="stylesheet" href="assets/css/wb.css">
<link rel="stylesheet" href="assets/css/ai.css">
<link rel="stylesheet" href="assets/css/dwb.css">
</head>
<body data-page="workbench" data-title="Digitiser workbench">
<div class="app">

  <header class="topbar">
    <button class="tbtn top-toggle" id="helpToggle" type="button" title="Show or hide the help (Ctrl+\)" aria-controls="helpPane" aria-expanded="true"><!--ICON:sidebar--></button>
    <a class="brand" href="#" title="Digitiser workbench">
      <svg class="brand-mark" viewBox="0 0 128 128" aria-hidden="true"><rect x="4" y="4" width="120" height="120" rx="26" fill="#17324A"/><path d="M30 24v74h76" fill="none" stroke="#F3F7FA" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 82l20-24 16 10 24-34" fill="none" stroke="#F59E0B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="58" cy="58" r="7" fill="#F3F7FA"/><circle cx="98" cy="34" r="7" fill="#F3F7FA"/></svg>
      <div>
        <div class="brand-title">Digitiser workbench</div>
        <div class="brand-sub">Read the values out of graphs in papers – with trace-digitiser, in your browser, where nothing is uploaded</div>
      </div>
    </a>
    <div class="spacer"></div>
    <span class="store-status" id="storeStatus" title="Your files are kept in this browser, on this computer"></span>
    <button class="btn" id="userBtn" type="button" title="Put your name into the workbench, and the terminal will show it in place of user"><!--ICON:user--><span class="user-name">user</span></button>
    <button class="btn" id="projectBtn" type="button" title="Download all your files, add files, or start afresh"><!--ICON:folder--><span>My files</span></button>
    <button class="btn" id="fullBtn" type="button" title="Full screen (F11 also works)"><!--ICON:expand--><span>Full screen</span></button>
  </header>

  <div class="main">
    <aside class="tut help-pane" id="helpPane" aria-label="Help">
      <div class="help-head">
        <button class="icon-btn help-home" type="button" title="Help: all topics" data-goto="h-home"><!--ICON:book2--></button>
        <div class="help-search"><!--ICON:search--><input id="helpSearch" type="search" placeholder="Search the help (e.g. points, tick, PDF)" autocomplete="off" aria-label="Search the help"></div>
        <button class="icon-btn help-collapse" id="helpCollapse" type="button" title="Hide the help so the workbench fills the window (Ctrl+\)"><!--ICON:sidebarClose--></button>
      </div>
      <div class="help-crumbs" id="helpCrumbs"></div>
      <div class="help-body" id="helpBody">
<!--HELP-->
      </div>
    </aside>

    <div class="splitter" role="separator" aria-orientation="vertical" title="Drag to resize, or double-click to reset"></div>

    <section class="bench" aria-label="Workbench">
      <div class="wb-tabs" role="tablist">
        <button class="wb-tab rail-btn" type="button" id="helpRail" title="Show the help (Ctrl+\)" hidden><!--ICON:sidebarOpen--><span>Help</span></button>
        <button class="wb-tab on" type="button" role="tab" data-wb="digitise" title="Digitise: a picture of a graph, and the mouse"><!--ICON:digitise--><span class="lbl">Digitise</span><span class="dot"></span></button>
        <button class="wb-tab" type="button" role="tab" data-wb="editor" title="Files"><!--ICON:folder--><span class="lbl">Files</span><span class="dot"></span></button>
        <button class="wb-tab" type="button" role="tab" data-wb="notebook" title="Notebook: Python, with trace-digitiser"><!--ICON:notebook--><span class="lbl">Notebook</span><span class="dot"></span></button>
        <button class="wb-tab" type="button" role="tab" data-wb="terminal" title="Terminal: trace-digitiser as a command"><!--ICON:terminal--><span class="lbl">Terminal</span><span class="dot"></span></button>
        <button class="wb-tab" type="button" role="tab" data-wb="assistant" title="AI assistant (yours: it needs your own key, and never sees your pictures)"><!--ICON:sparkle--><span class="lbl">AI</span><span class="dot"></span></button>
      </div>
      <div class="wb-body">
        <div class="wb-pane" data-wb="digitise"><div id="dgRoot"></div></div>
        <div class="wb-pane" data-wb="editor" hidden><div id="edRoot"></div></div>
        <div class="wb-pane" data-wb="notebook" hidden><div id="nbRoot"></div></div>
        <div class="wb-pane" data-wb="terminal" hidden><div id="termRoot"></div></div>
        <div class="wb-pane" data-wb="assistant" hidden><div id="aiRoot"></div></div>
      </div>
    </section>
  </div>
</div>

<noscript><p style="padding:20px">This page needs JavaScript.</p></noscript>

</body>
</html>
